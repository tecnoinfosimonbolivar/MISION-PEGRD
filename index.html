ital saludable y respetuosa, considerando derechos digitales y autocuidado.",preguntaFertil:"¿Cómo podríamos construir una identidad digital respetuosa en internet?",preguntaIntegradora:"¿Cómo podríamos, a partir de nuestras experiencias y gustos por la cultura digital y los entornos lúdicos, desarrollar competencias del siglo XXI (Pensamiento Crítico 🧩, Creatividad 💡, Comunicación 🗣️ y Colaboración 🤝) para afianzar una identidad digital respetuosa, el autocuidado y la gestión integral del riesgo ante sismos en nuestra escuela, nuestro hogar y nuestra comunidad?",territorio:{t1:{id:"t_juego",kicker:"GRADO 6º · EXPERIENCIA LÚDICA Y TRABAJO EN EQUIPO (AUTOCUIDADO Y CONVIVENCIA)",fase:"ANÁLISIS PRÁCTICO",concept:"Autoprotección y Convivencia: Identificar actitudes, valores y dinámicas de trabajo en equipo en juegos que promuevan la tranquilidad y la autoprotección sin generar pánico.",title:"Desde tu experiencia en juegos y entornos digitales, ¿qué actitudes de calma, empatía y trabajo en equipo consideras indispensables para orientar y ayudar a tu familia y compañeros a resguardarse durante un sismo?",sub:"Reflexiona sobre el autocuidado, el liderazgo sereno y la colaboración en situaciones de emergencia.",chips:["Mantener la calma, proyectar serenidad y guiar a mis compañeros hacia zonas de protección sin empujar ni correr...","Identificar con agilidad columnas firmes y mesas macizas lejos de ventanas para protegerme y proteger a los demás...","Fomentar la escucha activa y la colaboración para que todos acaten la señal de alarma y se agachen protegiéndose la cabeza..."]},t2:{id:"t_hogar",kicker:"GRADO 6º · PLAN FAMILIAR (ESPACIOS SEGUROS EN CASA)",fase:"ANÁLISIS PRÁCTICO",concept:"Mitigación de la Vulnerabilidad en el Hogar: Identificar estructuras firmes (bajo mesas resistentes o pasillos estructurales) y alejarse de ventanales.",title:"En tu vivienda (casa, apartamento o zona rural), ¿cuáles son los 3 lugares de protección más seguros donde tú y tu familia se pueden resguardar?",sub:"Señala sitios bajo vigas, columnas o mesas macizas de tu hogar lejos de vidrios.",chips:["En mi vivienda los 3 lugares más seguros son: bajo la mesa de comedor de madera maciza, junto a la columna de la sala y en el pasillo interno...","Nos protegemos lejos de los ventanales de vidrio, bajo la viga principal de la casa y en la zona de mayor resistencia estructural...","Acordamos en familia no intentar salir corriendo a la calle durante la sacudida y resguardarnos bajo estructuras resistentes..."]},t3:{id:"t_comunidad",kicker:"GRADO 6º · COMUNIDAD Y BARRIO (ZONAS DESPEJADAS)",fase:"EVALUACIÓN DIDÁCTICA",concept:"Escenario de Riesgo Comunitario: Zonas exteriores amplias libres de postes, cables caídos o fachadas con riesgo de desprendimiento.",title:"¿Cuál es el punto de encuentro despejado y seguro acordado fuera de tu casa en el barrio o vereda?",sub:"Ejemplo: Parque de La Pola, cancha deportiva, plazoleta comunal o potrero rural despejado.",chips:["El punto de encuentro acordado con mi familia es el parque de nuestro sector porque es amplio y libre de cables aéreos y postes...","Acordamos reunirnos en la cancha múltiple del barrio que está despejada y alejada de transformadores eléctricos...","En nuestro sector acordamos una plazoleta comunitaria abierta donde no hay peligro de caída de tejas, aleros ni árboles..."]}}},7:{nombreGrado:"Grado Séptimo (7°)",eje:"Ciudadanía Digital y Computación",competenciasSiglo21:"🧩 Pensamiento Crítico · 💡 Pensamiento Creativo · 🗣️ Comunicación Asertiva · 🤝 Colaboración Solidaria",objetivo:"Desarrollar conciencia sobre estrategias de seguridad en línea para prevenir delitos informáticos y proteger la identidad digital.",preguntaFertil:"¿Cómo podríamos adoptar estrategias para un uso seguro de internet?",preguntaIntegradora:"¿De qué manera el pensamiento crítico 🧩, la creatividad 💡 y la ciberseguridad nos permiten trabajar en equipo (colaboración 🤝 y comunicación 🗣️) para detectar trampas digitales, salvaguardar los datos sensibles de nuestra familia y desmentir noticias falsas (Fake News) sobre sismos y emergencias en redes sociales y WhatsApp?",territorio:{t1:{id:"t_juego",kicker:"GRADO 7º · CIBERSEGURIDAD Y VERIFICACIÓN CRÍTICA",fase:"ANÁLISIS PRÁCTICO",concept:"No Caigas en Trampas: En emergencias, los audios virales falsos aumentan el pánico colectivo y la vulnerabilidad comunitaria.",title:"En situaciones de emergencia sísmica circulan audios falsos y cadenas alarmistas en redes. ¿Cómo aplicas el pensamiento crítico y la verificación de fuentes oficiales (SGC, Bomberos, Cruz Roja) para no caer en trampas y proteger a tu comunidad?",sub:"Estrategias para neutralizar la desinformación y compartir únicamente partes oficiales verificados.",chips:["Verificar la fecha, hora y fuente oficial en las cuentas del SGC o Bomberos antes de compartir cualquier audio en WhatsApp...","Neutralizar cadenas alarmistas explicando con respeto a mi familia que los sismos no se pueden predecir con exactitud...","Bloquear enlaces sospechosos y solicitar comunicados verificados de las autoridades municipales de gestión del riesgo..."]},t2:{id:"t_hogar",kicker:"GRADO 7º · PLAN FAMILIAR (DIRECTORIO DE SOCORRO)",fase:"ANÁLISIS PRÁCTICO",concept:"Protocolos de Enlace Familiar: Registrar y memorizar las líneas oficiales de socorro ahorra minutos vitales.",title:"¿Tienes guardada en tu teléfono o plastificada en tu casa la lista con los números de emergencia de Ibagué (Bomberos 119, Cruz Roja 132, Defensa Civil 144)?",sub:"Describe cómo tu familia tiene a mano estos contactos y el acuerdo para comunicarse por SMS.",chips:["Sí, tenemos una ficha plastificada en la puerta con Bomberos 119, Cruz Roja 132, Defensa Civil 144 y Policía 123...","Guardé en mi celular en marcado rápido los números de emergencia de Ibagué y el teléfono de contacto clave familiar fuera de la ciudad...","En casa tenemos anotados los números de Bomberos 119 y Cruz Roja 132 en el botiquín y en los teléfonos de todos..."]},t3:{id:"t_comunidad",kicker:"GRADO 7º · PRIVACIDAD Y DATOS VITALES DEL HOGAR",fase:"EVALUACIÓN DIDÁCTICA",concept:"Protege tus Secretos: Respaldos cifrados de escrituras, documentos de identidad y pólizas médicas familiares.",title:"¿Qué medidas adoptas para que las copias de cédulas, pólizas de seguro y documentos familiares estén protegidos contra pérdidas y ciberdelitos?",sub:"Estrategias de respaldo digital seguro y resguardo físico en bolsas herméticas dentro de la Mochila 72H.",chips:["Guardamos copias escaneadas de cédulas, póliza escolar y escrituras en una memoria protegida dentro de la Mochila 72H...","Usamos contraseñas alfanuméricas complejas y doble factor de autenticación en las cuentas donde guardamos documentos familiares...","Protegemos la información médica de la familia tanto en fichas plastificadas como en copias digitales respaldadas..."]}}},8:{nombreGrado:"Grado Octavo (8°)",eje:"Ciudadanía Digital y Computación",competenciasSiglo21:"🧩 Pensamiento Crítico · 💡 Pensamiento Creativo · 🗣️ Comunicación Asertiva · 🤝 Colaboración Solidaria",objetivo:"Analizar el impacto de desarrollos computacionales en la soberanía tecnológica y proponer soluciones éticas.",preguntaFertil:"¿Cómo podríamos analizar el impacto de la tecnología en nuestra soberanía tecnológica?",preguntaIntegradora:"¿Cómo podríamos aplicar el pensamiento sistémico y computacional para diagnosticar vulnerabilidades en nuestro entorno, fomentando las 4 C's (Pensamiento Crítico 🧩, Creatividad 💡, Comunicación 🗣️ y Colaboración 🤝) y la soberanía tecnológica al servicio del Plan Familiar y la autoprotección sísmica en Ibagué?",territorio:{t1:{id:"t_juego",kicker:"GRADO 8º · PENSAMIENTO SISTÉMICO Y RESOLUCIÓN DE RETOS",fase:"ANÁLISIS PRÁCTICO",concept:"Pensamiento Sistémico y Rutas Seguras: Analizar el entorno como un sistema para identificar y mitigar peligros físicos y tecnológicos.",title:"Al analizar los retos de tu entorno (escuela, hogar o barrio), ¿qué obstáculos físicos o comunicativos identificas como prioritarios de resolver en equipo para garantizar una evacuación segura ante un sismo?",sub:"Propón soluciones colaborativas para despejar rutas, mitigar peligros y coordinar a las personas.",chips:["Priorizar despejar pasillos estrechos y retirar macetas o estantes sueltos que obstruyan la puerta principal...","Organizar un simulacro familiar para practicar el corte seguro de gas y luz sin generar desorden ni tropiezos...","Mapear con los vecinos los cables caídos y postes inestables de la cuadra para fijar una ruta alterna despejada..."]},t2:{id:"t_hogar",kicker:"GRADO 8º · PLAN FAMILIAR (ANCLAJE DE OBJETOS PESADOS)",fase:"ANÁLISIS PRÁCTICO",concept:"Mitigación de la Vulnerabilidad Física: Más del 70% de las lesiones en sismos ocurren por objetos pesados no anclados que caen.",title:"¿Identificaste en tu casa si los armarios, televisores o estantes están fijados a la pared para evitar que caigan en un sismo?",sub:"Medidas concretas de prevención física en salas, pasillos, cocina y dormitorios.",chips:["Identificamos que los estantes de la sala y el armario principal deben anclarse a la pared con chazos metálicos firmes...","Revisamos que no haya televisores ni repisas pesadas sobre las cabeceras de las camas para evitar traumatismos graves...","En mi casa fijamos el soporte del televisor y aseguramos la estantería alta para que no obstruya la puerta al volcarse..."]},t3:{id:"t_comunidad",kicker:"GRADO 8º · COMUNIDAD E INFRAESTRUCTURA",fase:"EVALUACIÓN DIDÁCTICA",concept:"Exposición ante Fallas del Entorno: Postes inclinados, laderas inestables o redes eléctricas en riesgo en la manzana.",title:"¿Qué riesgos del entorno cercano a tu vivienda (postes inclinados, laderas con riesgo de deslizamiento o cables sueltos) representan una amenaza para tu vecindario?",sub:"Diagnóstico visual y crítico de las vías y manzanas circundantes en Ibagué.",chips:["Cerca de mi vivienda hay un poste inclinado con exceso de cableado y una ladera que monitoreamos en época de lluvias...","Identificamos una vivienda antigua con aleros y tejas de barro agrietadas que amenazan la acera principal de tránsito...","El riesgo vecinal son cables eléctricos bajos cerca de árboles grandes que podrían chispear y cortar la ruta de evacuación..."]}}},9:{nombreGrado:"Grado Noveno (9°)",eje:"Ciudadanía Digital y Computación",competenciasSiglo21:"🧩 Pensamiento Crítico · 💡 Pensamiento Creativo · 🗣️ Comunicación Asertiva · 🤝 Colaboración Solidaria",objetivo:"Investigar y reflexionar sobre sesgos y estereotipos en la información en línea y proponer estrategias de mitigación.",preguntaFertil:"¿Cómo podríamos enfrentar los sesgos en la información en internet?",preguntaIntegradora:"¿Cómo podemos aplicar la comunicación asertiva 🗣️, el pensamiento crítico 🧩 y el liderazgo empático y colaborativo 🤝 para superar sesgos algorítmicos, evitar la desinformación en momentos de crisis y organizar brigadas familiares solidarias e inclusivas (cuidando a niños, adultos mayores y mascotas) ante sismos?",territorio:{t1:{id:"t_juego",kicker:"GRADO 9º · COMUNICACIÓN ASERTIVA Y PRIMEROS AUXILIOS EMOCIONALES",fase:"ANÁLISIS PRÁCTICO",concept:"Primeros Auxilios Psicológicos: Contener el pánico, calmar la ansiedad y organizar la evacuación sin estampidas humanas.",title:"En un momento de crisis por sismo, el pánico y la desinformación pueden nublar las decisiones. ¿Cómo ejerces un liderazgo positivo y aplicas comunicación asertiva para brindar serenidad y contención emocional a tu familia o compañeros?",sub:"Técnicas de respiración guiada, escucha empática y distribución solidaria de responsabilidades.",chips:["Guiar a todos con voz calmada practicando respiración profunda y recordando los pasos de autoprotección acordados...","Escuchar con empatía a quien entre en crisis de nervios, tomándole de las manos y acompañándole al punto de encuentro...","Emitir mensajes breves y directos, evitando gritos o rumores que puedan provocar carreras descontroladas..."]},t2:{id:"t_hogar",kicker:"GRADO 9º · PLAN FAMILIAR (ATENCIÓN PRIORITARIA E INCLUSIÓN)",fase:"ANÁLISIS PRÁCTICO",concept:"Inclusión y Solidaridad: Familias resilientes asignan previamente responsables específicos para quienes tienen movilidad reducida.",title:"En tu familia, ¿quién necesita apoyo prioritario (bebés, adultos mayores, personas con discapacidad o mascotas) y quién es el responsable asignado para asistirlos?",sub:"Organización familiar de evacuación asistida y roles solidarios.",chips:["En mi hogar mi abuela necesita apoyo prioritario; mi papá es el responsable de acompañarla y yo llevo a nuestra mascota asegurada...","Tenemos un niño pequeño en casa: mi mamá lo toma en brazos y mi hermano mayor se encarga de abrir la puerta y llevar la Mochila 72H...","Asignamos roles claros: yo asisto a mi familiar con movilidad reducida con calma mientras otro adulto toma el botiquín y documentos..."]},t3:{id:"t_comunidad",kicker:"GRADO 9º · MITIGACIÓN DE SESGOS Y RUMORES EN CRISIS",fase:"EVALUACIÓN DIDÁCTICA",concept:"Liderazgo Comunitario: Desactivar rumores infundados de saqueos o compras de pánico mediante información veraz y contrastada.",title:"¿Qué estrategia propones para evitar que la desinformación en redes sociales cause compras de pánico o histeria en tu comunidad tras un temblor?",sub:"Acciones para serenar a los vecinos y canalizar ayuda mutua real.",chips:["Establecer un canal de difusión vecinal administrado solo por líderes para compartir partes oficiales verificados de Bomberos y Cruz Roja...","Promover la regla de oro: si un mensaje o audio no tiene fecha, firma ni fuente verificable oficial de Ibagué, jamás se reenvía...","Capacitar a los grupos de WhatsApp comunitarios para priorizar la solidaridad y evitar la especulación de víveres..."]}}},10:{nombreGrado:"Grado Décimo (10°)",eje:"Ciudadanía Digital y Computación",competenciasSiglo21:"🧩 Pensamiento Crítico · 💡 Pensamiento Creativo · 🗣️ Comunicación Asertiva · 🤝 Colaboración Solidaria",objetivo:"Evaluar críticamente la importancia de la neutralidad de la red y proponer mejoras.",preguntaFertil:"¿Cómo podríamos evaluar la importancia de la neutralidad de la red en la sociedad?",preguntaIntegradora:"¿De qué manera el análisis de la neutralidad de la red y los sistemas computacionales nos impulsa a desarrollar pensamiento crítico 🧩, creatividad 💡 y colaboración 🤝 para garantizar canales de comunicación abiertos, coordinar censos familiares resilientes y priorizar la ayuda comunitaria si las redes comerciales colapsan tras un sismo?",territorio:{t1:{id:"t_juego",kicker:"GRADO 10º · REDES RESILIENTES Y COMUNICACIÓN EN CRISIS",fase:"ANÁLISIS PRÁCTICO",concept:"Arquitectura Resiliente y Canales de Emergencia: Transmisión de datos prioritarios de texto ligero cuando la banda ancha y la telefonía colapsan.",title:"Si tras un sismo fuerte colapsa la telefonía móvil comercial y el internet en la ciudad, ¿qué alternativas tecnológicas y acuerdos colaborativos propones para transmitir mensajes prioritarios de auxilio y estado de salud?",sub:"Uso de mensajes de texto SMS ligeros, radios comunitarias, canales fuera de zona y acuerdos previos.",chips:["Acordar el uso exclusivo de SMS cortos hacia un contacto fuera de la ciudad para no congestionar antenas con llamadas de voz...","Disponer de radios portátiles de baterías para sintonizar emisoras institucionales y radioaficionados de socorro...","Establecer una red de mensajería barrial a pie entre los puntos de encuentro coordinada por brigadistas juveniles..."]},t2:{id:"t_hogar",kicker:"GRADO 10º · PLAN FAMILIAR (COMUNICACIÓN RESILIENTE Y CONTACTO PUENTE)",fase:"ANÁLISIS PRÁCTICO",concept:"Contacto Puente Fuera de Zona: Las líneas interdepartamentales o mensajes de texto se saturan menos que las llamadas de voz locales.",title:"Si la red celular local colapsa en Ibagué, ¿cuál es el segundo punto de encuentro alejado o el familiar fuera de la ciudad acordado como contacto puente?",sub:"Acuerdos clave de conexión familiar ante un blackout tecnológico o caída de antenas.",chips:["Nuestro contacto puente es mi tía en Pereira: todos le enviaremos un SMS breve indicando que estamos a salvo...","Si las redes locales colapsan, nuestro segundo punto de encuentro acordado es la vivienda de familiares en una zona plana y despejada...","Acordamos no saturar la red con llamadas de voz repetitivas y usar exclusivamente mensajes de texto hacia un pariente puente..."]},t3:{id:"t_comunidad",kicker:"GRADO 10º · COMPUTACIÓN Y CENSO DE PERSONAS RESILIENTES",fase:"EVALUACIÓN DIDÁCTICA",concept:"Censo y Normalización de Datos: Facilitar la trazabilidad de las familias evacuadas del vecindario en tiempo real.",title:"¿Cómo estructurarías una base de datos o sistema digital ligero para registrar el censo de familias evacuadas, personas a salvo y necesidades médicas en tu barrio?",sub:"Estructura de campos y validaciones requeridas para el reporte rápido a organismos de socorro (Bomberos, Cruz Roja, Defensa Civil).",chips:["Una tabla relacional con ID familiar, integrantes evacuados, estado de salud prioritario y ubicación en el punto de encuentro exterior...","Un formulario digital offline servido en red local para registro rápido de novedades y censos familiares...","Un sistema de tarjetas de registro con código QR offline para conteo rápido y trazabilidad de personas a salvo..."]}}},11:{nombreGrado:"Grado Undécimo (11°)",eje:"Ciudadanía Digital y Computación",competenciasSiglo21:"🧩 Pensamiento Crítico · 💡 Pensamiento Creativo · 🗣️ Comunicación Asertiva · 🤝 Colaboración Solidaria",objetivo:"Investigar y reflexionar sobre el impacto ambiental de la computación y proponer medidas sostenibles.",preguntaFertil:"¿Cómo podríamos contribuir a reducir el impacto ambiental de la computación?",preguntaIntegradora:"¿Cómo podríamos articular la computación sostenible y el emprendimiento social con las 4 C's del siglo XXI (Pensamiento Crítico 🧩, Creatividad 💡, Comunicación 🗣️ y Colaboración 🤝) para idear soluciones tecnológicas de bajo impacto ecológico que fortalezcan el Plan Familiar de Emergencia y la resiliencia comunitaria frente a sismos?",territorio:{t1:{id:"t_juego",kicker:"GRADO 11º · COMPUTACIÓN SOSTENIBLE Y EMPRENDIMIENTO SOCIAL",fase:"ANÁLISIS PRÁCTICO",concept:"Computación Sostenible y Resiliencia Territorial: Reutilizar hardware (RAEE), software libre y tecnologías accesibles al servicio de la prevención y autoprotección comunitaria.",title:"¿Cómo aprovecharías la computación sostenible (reutilización de hardware RAEE, software libre y tecnologías de bajo consumo) para implementar una iniciativa comunitaria que mejore la prevención ante desastres?",sub:"Propuesta de impacto social que combine conciencia ecológica, trabajo en equipo y cultura de la prevención.",chips:["Acondicionar computadores reciclados con software libre y mapas offline de Ibagué para las sedes comunales del barrio...","Reutilizar baterías de portátiles y paneles solares pequeños para alimentar estaciones de carga de emergencia y linternas comunitarias...","Implementar un repositorio local offline con cartillas de primeros auxilios y planes de evacuación comunitarios..."]},t2:{id:"t_hogar",kicker:"GRADO 11º · PLAN FAMILIAR (AUTONOMÍA ENERGÉTICA Y COMUNICACIONES)",fase:"ANÁLISIS PRÁCTICO",concept:"Resiliencia Energética y Tecnológica: Mantener radios, powerbanks y linternas operativas ante un apagón prolongado.",title:"En caso de un corte prolongado de energía tras un temblor, ¿qué fuentes de energía de respaldo (powerbanks, radio a pilas o linternas dinamo) tiene tu hogar preparadas en la Mochila 72H?",sub:"Gestión preventiva de baterías, recargas periódicas y comunicación sin red eléctrica.",chips:["Tenemos dos baterías portátiles (powerbanks) cargadas al 100% y un radio analógico con pilas selladas en la Mochila 72H...","Disponemos de linternas LED recargables y acordamos un protocolo de ahorro estricto de batería en los teléfonos...","Contamos con una linterna dinamo que no depende de pilas y guardamos cargadores en bolsa hermética para emergencias..."]},t3:{id:"t_comunidad",kicker:"GRADO 11º · GESTIÓN DEL RIESGO Y CARTOGRAFÍA SOCIAL",fase:"EVALUACIÓN DIDÁCTICA",concept:"Cartografía Social y Gobernanza Territorial: Articular a la comunidad escolar y barrial en brigadas de respuesta rápida.",title:"¿Cómo liderarías junto a tus compañeros una brigada comunitaria juvenil que elabore la cartografía social de riesgos y oriente a los vecinos en el punto de encuentro exterior?",sub:"Liderazgo juvenil, pedagogía social del riesgo y articulación con líderes comunitarios de Ibagué.",chips:["Organizando jornadas de mapeo participativo con la junta de acción comunal para señalizar rutas de evacuación seguras...","Capacitando a las familias vecinas en la técnica de autoprotección (Agacharse, Cubrirse y Sujetarse) y primeros auxilios básicos...","Diseñando mapas digitales y cartillas interactivas que indiquen las zonas seguras y rutas de evacuación de nuestro barrio ante eventos sísmicos..."]}}}},j0=[{id:"plataforma",type:"single",kicker:"FASE EXPLORATORIA · RECONOCIMIENTO DEL ENTORNO DIGITAL Y TECNOLÓGICO",fase:"IDENTIFICACIÓN",title:"¿En qué dispositivo tecnológico o digital accedes habitualmente para comunicarte, informarte y simular protocolos de emergencia?",sub:"Selección única: Identifica tu entorno tecnológico prioritario para interactuar, consultar mapas y coordinar acciones de prevención.",context:"Los dispositivos digitales son canales clave para recibir alertas tempranas de la Unidad Nacional para la Gestión del Riesgo de Desastres (UNGRD) y la Cruz Roja Colombiana.",notebookPrompt:"Anota en tu cuaderno tu dispositivo preferido y reflexiona cómo este equipo permite ejecutar simuladores de emergencia y recibir alertas.",detailedNotebookGuidance:`👉 Revisa: El hardware y los dispositivos que tienes en casa para interactuar.
✍️ Escribe en tu cuaderno: "1. Entorno Tecnológico y Comunicación: Utilizo [tu dispositivo] y reflexiono que mediante la tecnología y las simulaciones interactivas podemos entrenar evacuaciones reales en Ibagué sin exponernos al peligro físico."`,cols3:!0,options:[{v:"Smartphone / Celular personal o familiar",s:"Alertas tempranas, mensajes SMS de emergencia, linterna y geolocalización",iconType:"mobile"},{v:"Computador (PC de escritorio o portátil)",s:"Cartografía digital, diseño de planos 2D y plataformas institucionales",iconType:"pc"},{v:"Tablet / iPad",s:"Visualización táctil de protocolos y mapas de evacuación",iconType:"tablet"},{v:"Radio portátil / Televisor",s:"Monitoreo continuo de boletines informativos oficiales de la UNGRD",iconType:"gamepad"},{v:"Computadores de la Sala de Informática (IETSB)",s:"Simulación pedagógica y formación técnica en autoprotección escolar",iconType:"browser"}]},{id:"genero",type:"single",kicker:"FASE EXPLORATORIA · HERRAMIENTAS DIGITALES Y TOMA DE DECISIONES",fase:"IDENTIFICACIÓN",title:"¿Qué tipo de simulador o herramienta digital consideras más efectiva para entrenar la respuesta rápida ante una emergencia?",sub:"Selección única: Elige la dinámica digital que mejor entrena la toma de decisiones serena bajo presión sísmica.",context:"La Ley 1523 de 2012 promueve el conocimiento del riesgo. Las simulaciones digitales permiten entrenar reflejos y salvar vidas sin exponerse a peligros físicos.",notebookPrompt:"Escribe la herramienta digital que elegiste y cómo entrena tu rapidez mental y serenidad ante situaciones de riesgo.",detailedNotebookGuidance:`👉 Revisa: La herramienta digital que elegiste y su relación con la resolución de problemas.
✍️ Escribe en tu cuaderno: "2. Herramientas Digitales y Simulación: Mi opción preferida es [tu opción seleccionada], la cual desarrolla mis reflejos y mi capacidad de tomar decisiones serenas y estratégicas bajo presión durante una emergencia sísmica."`,cols2:!0,options:[{v:"Simuladores de evacuación en tiempo real y toma de decisiones bajo presión",s:"Entrenamiento de reflejos, serenidad y liderazgo ante sismos",iconType:"map"},{v:"Cartografía digital y mapas interactivos de amenazas y rutas de escape",s:"Mapeo de fallas geológicas, ríos y puntos seguros en Ibagué",iconType:"target"},{v:"Aplicaciones móviles de alerta sísmica y kits de supervivencia 72H",s:"Notificaciones tempranas y checklists de preparación familiar",iconType:"zap"},{v:"Modelado y diseño arquitectónico 2D de planos de vivienda y zonas seguras",s:"Distribución espacial de muros, salidas y código de colores oficial",iconType:"tool"},{v:"Juegos de rol y simulaciones de brigadistas escolares y primeros auxilios",s:"Protocolos de triaje, auxilio inclusivo y extinción de fuegos",iconType:"users"},{v:"Trivias interactivas y cuestionarios de resolución de problemas lógicos",s:"Retos cognitivos, pistas y normatividad de gestión del riesgo",iconType:"lightbulb"}]},{id:"interland",type:"single",kicker:"COMPRENSIÓN CONCEPTUAL · CIUDADANÍA DIGITAL Y LAS 4 C'S DEL SIGLO XXI",fase:"COMPRENSIÓN ACTIVA",title:"¿Cuál pilar de la Ciudadanía Digital y las competencias del siglo XXI consideras más indispensable en tu vida diaria?",sub:"Selección única: Habilidades esenciales para convivir con respeto, seguridad y pensamiento crítico en entornos digitales.",context:"La Ciudadanía Digital y las 4 C's (Pensamiento Crítico 🧩, Creatividad 💡, Comunicación 🗣️ y Colaboración 🤝) nos enseñan a navegar seguros, detectar trampas y trabajar unidos ante emergencias reales.",notebookPrompt:"Escribe en tu cuaderno las 4 C's del siglo XXI y el pilar que seleccionaste.",detailedNotebookGuidance:`👉 Revisa: Las 4 Competencias del Siglo XXI: Pensamiento Crítico 🧩, Creatividad 💡, Comunicación Asertiva 🗣️ y Colaboración Solidaria 🤝.
✍️ Escribe en tu cuaderno: "3. Ciudadanía Digital y 4 C's: Me comprometo a aplicar [tu pilar seleccionado], asegurando que en situaciones de emergencia no compartiré noticias falsas (Fake News) y protegeré los datos sensibles de mi familia."`,cols2:!0,options:[{v:"Pensamiento Crítico y Verificación (No caer en trampas ni Fake News 🧩)",s:"Analizo antes de compartir, detecto estafas y verifico fuentes oficiales",iconType:"shield-alert"},{v:"Ciberseguridad y Autocuidado (Protege tus secretos y datos familiares 🔒)",s:"Contraseñas seguras, doble autenticación y resguardo de documentos",iconType:"key"},{v:"Comunicación Asertiva y Responsable (Comparte con cuidado 🗣️)",s:"Mensajes claros, respeto en redes y evitar cadenas de pánico innecesarias",iconType:"message-circle"},{v:"Colaboración y Convivencia Digital (Ser amable es genial 🤝)",s:"Cero toxicidad ni ciberacoso; juego limpio, empatía y apoyo mutuo",iconType:"heart"},{v:"Creatividad e Innovación Social (Soluciones tecnológicas útiles 💡)",s:"Proponer ideas lúdicas y tecnológicas para proteger a mi comunidad",iconType:"sparkles"}]},{id:"amenaza_concepto",type:"single",kicker:"COMPRENSIÓN TÉCNICA · GESTIÓN DEL RIESGO Y LEY 1523 DE 2012",fase:"COMPRENSIÓN ACTIVA",title:"¿Qué es una AMENAZA en el Plan Escolar de Gestión del Riesgo (PEGRD)?",sub:"Selección única: Comprende el concepto técnico de amenaza antes de identificarla en tu colegio y vivienda.",context:"En el marco de la Ley 1523 de 2012, una amenaza es un factor de peligro externo fuera de nuestro control directo que puede desencadenar una emergencia.",notebookPrompt:"Escribe la definición de AMENAZA y anota 3 ejemplos (natural, antrópica y socio-natural).",detailedNotebookGuidance:`👉 Revisa: La diferencia entre amenazas naturales (sismos, volcanes), antrópicas (fugas de gas, incendios) y socio-naturales.
✍️ Escribe en tu cuaderno: "4. Definición de AMENAZA (Ley 1523): Es un factor latente o fenómeno físico externo con potencial de causar daño a personas y edificaciones. En Ibagué nuestras principales amenazas son los sismos por fallas geológicas y eventos asociados al Volcán Machín."`,cols2:!0,options:[{v:"Un factor latente o fenómeno físico externo que puede causar pérdidas humanas, lesiones o daños materiales",s:"Concepto oficial del PEGRD y la Ley 1523 de 2012",iconType:"alert-triangle"},{v:"La cantidad de dinero que cuesta reparar un colegio después de una catástrofe",s:"Corresponde a costos de reconstrucción económica, no a la amenaza",iconType:"dollar-sign"},{v:"Cualquier discusión o desacuerdo entre compañeros durante un videojuego",s:"Conflicto de convivencia, no amenaza física de desastres",iconType:"users"},{v:"El sonido del timbre que indica la hora del descanso escolar",s:"Señal de horario regular, no factor de riesgo",iconType:"bell"}]},{id:"vulnerabilidad_concepto",type:"single",kicker:"COMPRENSIÓN TÉCNICA · ANÁLISIS DE VULNERABILIDAD",fase:"COMPRENSIÓN ACTIVA",title:"¿A qué se refiere la VULNERABILIDAD de una vivienda, escuela o comunidad?",sub:"Selección única: Aprende a evaluar qué tan expuestos y preparados estamos frente a una amenaza.",context:"La vulnerabilidad representa la fragilidad física, estructural o social que predispone a personas e infraestructuras a sufrir daño si ocurre un evento adverso.",notebookPrompt:"Escribe la definición de VULNERABILIDAD y cómo se puede reducir en el hogar.",detailedNotebookGuidance:`👉 Revisa: La vulnerabilidad física (muros agrietados, estantes no anclados) y organizativa (no tener plan ni mochila 72H).
✍️ Escribe en tu cuaderno: "5. Definición de VULNERABILIDAD: Es la fragilidad física o falta de preparación de una comunidad o estructura que la hace susceptible de sufrir daño. En mi casa reducimos la vulnerabilidad fijando muebles altos y acordando rutas de salida."`,cols2:!0,options:[{v:"La fragilidad física o falta de preparación de una estructura o personas que las hace susceptibles de sufrir daño",s:"La vulnerabilidad sí se puede reducir mediante educación y obras",iconType:"shield"},{v:"La magnitud o fuerza del terremoto medida en la escala de sismología",s:"Eso mide la intensidad de la amenaza natural, no la vulnerabilidad",iconType:"activity"},{v:"El número de cámaras y computadores que tiene la sala de tecnología",s:"Inventario de equipos informáticos institucionales",iconType:"cpu"},{v:"La distancia exacta en kilómetros desde la casa hasta el centro de la ciudad",s:"Coordenada geográfica territorial",iconType:"navigation"}]},{id:"riesgo_formula",type:"single",kicker:"MODELO CIENTÍFICO · FÓRMULA DE GESTIÓN DEL RIESGO",fase:"COMPRENSIÓN ACTIVA",title:"En la gestión del riesgo de desastres, ¿cuál es la fórmula matemática y conceptual del RIESGO?",sub:"Selección única: Descubre cómo el orden y la preparación reducen drásticamente las emergencias.",context:"El riesgo es la probabilidad de que ocurran daños. No podemos evitar un terremoto, pero si disminuimos la vulnerabilidad y aumentamos la organización, ¡el riesgo baja al mínimo!",notebookPrompt:"Escribe en tu cuaderno la fórmula del riesgo y explica por qué la organización familiar lo reduce.",detailedNotebookGuidance:`👉 Revisa: La ecuación R = (A × V) ÷ Capacidad de Organización.
✍️ Escribe en tu cuaderno: "6. FÓRMULA MATEMÁTICA DEL RIESGO: Riesgo = (Amenaza × Vulnerabilidad) ÷ Organización. Conclusión: Aunque no podemos evitar que tiemble la tierra (Amenaza fija), al prepararnos en familia y tener mochila y plano (Capacidad alta), el riesgo disminuye al mínimo."`,cols2:!0,options:[{v:"Riesgo = (Amenaza × Vulnerabilidad) ÷ Organización: A mayor preparación escolar y familiar, menor es el riesgo",s:"Fórmula rectora del Plan Escolar de Gestión del Riesgo",iconType:"check-circle"},{v:"Riesgo = Número de Estudiantes + Cantidad de Salones + Peso de los Libros",s:"Suma de inventario físico sin relación matemática con el riesgo",iconType:"x-circle"},{v:"Riesgo = Velocidad de salida corriendo empujando a los demás por las escaleras",s:"Comportamiento de alto peligro que multiplica accidentes y caídas",iconType:"alert-octagon"},{v:"Riesgo = Tiempo de espera en minutos hasta que lleguen los rescatistas externos",s:"Dependencia pasiva que no previene el daño primario",iconType:"clock"}]},{id:"peligro_exposicion",type:"single",kicker:"APLICACIÓN CONCEPTUAL · DIFERENCIACIÓN ENTRE PELIGRO Y EXPOSICIÓN",fase:"APLICACIÓN PRÁCTICA",title:"¿Cuál es la diferencia clave entre PELIGRO y EXPOSICIÓN en el colegio y en el hogar?",sub:"Selección única: Identifica qué elementos pueden fallar y quiénes se encuentran en la zona susceptible.",context:"En prevención de desastres, diferenciar el peligro físico de la exposición humana es fundamental para diseñar el plano de la vivienda y las rutas seguras.",notebookPrompt:"Anota la diferencia entre peligro y exposición con un ejemplo de tu vivienda.",detailedNotebookGuidance:`👉 Revisa: Peligro = la fuente de riesgo (ej: ventana de vidrio grande sin película protectora). Exposición = personas ubicadas debajo de la ventana.
✍️ Escribe en tu cuaderno: "7. Peligro vs Exposición: El peligro es la fuente potencial de daño (ej: pipeta de gas o estante no fijado); la exposición es la presencia de personas en su radio de caída. Para protegernos debemos retirar camas y escritorios lejos de ventanales."`,cols2:!0,options:[{v:"El peligro es la fuente o condición potencial de daño; la exposición es la presencia de personas en esa zona",s:"Diferenciación conceptual indispensable para diseñar mapas y planos seguros",iconType:"shield-check"},{v:"El peligro ocurre únicamente en el colegio y la exposición solo existe en redes sociales",s:"Ambos conceptos aplican en todos los territorios: colegio, casa y barrio",iconType:"globe"},{v:"Peligro y exposición son palabras exactamente idénticas sin ninguna diferencia práctica",s:"Confusión común que impide una planificación de seguridad rigurosa",iconType:"alert-triangle"},{v:"Exposición significa únicamente realizar una presentación oral en la clase de TecnoInfo",s:"Sentido pedagógico escolar distinto al contexto de gestión del riesgo",iconType:"file-text"}]},{id:"alerta_sismo",type:"single",kicker:"AUTOPROTECCIÓN INMEDIATA · CONDUCTA ANTE MOVIMIENTO TELÚRICO",fase:"APLICACIÓN PRÁCTICA",title:"Ante el inicio de un sismo fuerte, ¿cuál es la conducta inmediata de autoprotección en cualquier lugar (hogar, colegio o calle)?",sub:'Selección única: Protocolo universal "Agacharse, Cubrirse y Sujetarse" aplicable dondequiera que te encuentres.',context:"Lección sísmica nacional: Durante la sacudida jamás se debe salir corriendo a la calle ni bajar escaleras: la prioridad absoluta es proteger la cabeza y nuca, resguardarse bajo estructuras firmes y mantener la calma.",notebookPrompt:"Escribe en tu cuaderno la regla de los 3 pasos: Agacharse, Cubrirse y Sujetarse.",detailedNotebookGuidance:`👉 Revisa: El protocolo universal de supervivencia ante terremotos.
✍️ Escribe en tu cuaderno: "8. CONDUCTA INMEDIATA DURANTE EL SISMO: 1° Agacharse (reducir centro de gravedad). 2° Cubrirse (proteger cabeza y nuca bajo mesa maciza o junto a columna firme). 3° Sujetarse (aferrarse a las patas de la mesa). Jamás correr ni bajar escaleras mientras el suelo se mueva."`,cols2:!0,options:[{v:"Autoprotección inmediata: Agacharme, cubrirme bajo mesa o estructura firme y sujetarme protegiendo cabeza y nuca",s:"Postura universal que previene traumatismos por caída de mampostería, vidrios o techos",iconType:"shield"},{v:"Salir corriendo despavorido hacia la calle o bajar escaleras durante la sacudida",s:"Error crítico: caídas, estampidas y desprendimiento de fachadas causan la mayoría de lesiones",iconType:"alert-triangle"},{v:"Quedarme de pie junto a ventanales de vidrio o vitrinas para mirar qué ocurre afuera",s:"Peligro inminente: las ondas sísmicas rompen los vidrios lanzando fragmentos cortantes",iconType:"x-circle"},{v:"Detenerme a rescatar pertenencias materiales, buscar cargadores o grabar videos para redes",s:"Negligencia: la vida y la integridad física prevalecen sobre cualquier objeto",iconType:"smartphone"}]},{id:"alarma_evacuacion",type:"single",kicker:"EVACUACIÓN Y REUNIFICACIÓN · ACCIONES DESPUÉS DEL SISMO",fase:"APLICACIÓN PRÁCTICA",title:"Una vez cesa la sacudida sísmica o se activa la evacuación, ¿cuál es el procedimiento correcto para trasladarse a un punto seguro?",sub:"Selección única: Evacuación calmada por rutas seguras hacia el punto de encuentro despejado.",context:"Protocolo general de evacuación: Solo cuando el movimiento termine, se evacúa con paso firme, cubriendo la cabeza, bajando por la derecha, cortando suministros si es viable y reuniéndose en el punto seguro exterior.",notebookPrompt:"Anota en tu cuaderno las acciones del DESPUÉS: corte de suministros, manos en la cabeza y punto de encuentro.",detailedNotebookGuidance:`👉 Revisa: Los pasos tras cesar el sismo: verificar estado físico, cortar suministros de servicios y caminar en fila hacia el punto exterior.
✍️ Escribe en tu cuaderno: "9. EVACUACIÓN POST-SISMO: Salir en orden, con manos sobre la nuca, bajando por el lado derecho de las escaleras sin empujar. Reunirse en el punto exterior acordado (parque o cancha) y verificar que todos los familiares o compañeros estén presentes."`,cols2:!0,options:[{v:"Evacuación ordenada: Paso firme sin correr, cubriendo la cabeza, hacia el punto de encuentro exterior despejado",s:"Traslado seguro hacia zonas abiertas sin cables aéreos, postes ni fachadas inestables",iconType:"shield"},{v:"Monitor / Líder de Calma y Convivencia: Brindar serenidad y apoyo psicológico a personas con miedo o ansiedad",s:"Primeros auxilios emocionales y respiración guiada para evitar bloqueos y pánico",iconType:"heart"},{v:"Verificador de Espacios: Asegurar con serenidad que ningún familiar o compañero quede rezagado o atrapado",s:"Revisión rápida de habitaciones o áreas antes de salir de último",iconType:"check-square"},{v:"Enlace Comunitario / SCI: Ayudar al censo y conteo de personas en el punto de encuentro acordado",s:"Verificación del estado de salud de todos y reporte a organismos de socorro",iconType:"users"},{v:"Líder de Evacuación Familiar: Guiar a la familia con la Mochila 72H hacia la zona comunitaria acordada",s:"Coordinación del Plan Familiar de Emergencia protegiendo a niños y adultos mayores",iconType:"home"}]},{id:"mochila_familiar",type:"checkboxes",kicker:"CIRCULAR 079 DE 2026 UNGRD · PLAN FAMILIAR (MOCHILA 72 HORAS)",fase:"APLICACIÓN PRÁCTICA",title:"¿Cuáles elementos indispensables preparas o acuerdas tener en la Mochila de Emergencia 72H de tu hogar?",sub:"Casillas de verificación: Marca al menos dos (2) casillas indispensables para garantizar la supervivencia durante 3 días:",context:'Circular 079 de 2026 UNGRD: "La resiliencia empieza en casa". Tras un desastre mayor, los servicios básicos pueden interrumpirse hasta por 72 horas.',notebookPrompt:"Escribe en tu cuaderno la lista completa de elementos que componen la Mochila de 72 Horas.",detailedNotebookGuidance:`👉 Revisa: Los elementos vitales para 3 días de autonomía familiar.
✍️ Escribe en tu cuaderno: "10. MOCHILA DE EMERGENCIA (KIT DE 72 HORAS): Debe estar lista junto a la puerta principal y contener: 1. Agua embotellada y enlatados no perecederos. 2. Linterna y radio a pilas. 3. Botiquín con medicamentos permanentes. 4. Copias de cédulas y póliza estudiantil en bolsa hermética. 5. Silbato y llave de repuesto."`,minRequired:2,options:[{v:"💧 Agua potable embotellada y alimentos no perecederos enlatados para 3 días",s:"Nutrición e hidratación básica vital para todos los miembros del hogar"},{v:"🔦 Linterna con pilas de repuesto y silbato de socorro de alta frecuencia",s:"Iluminación ante apagones y llamado de auxilio sin desgastar la voz ni el oxígeno"},{v:"📻 Radio portátil a pilas para sintonizar boletines oficiales de emergencia en Ibagué",s:"Información verídica sin depender de redes de telefonía celular colapsadas"},{v:"🩹 Botiquín de primeros auxilios y medicamentos prioritarios de tratamiento familiar",s:"Gasas estériles, vendas, antisépticos y medicación para asmáticos o hipertensos"},{v:"📁 Copia de documentos de identidad, llaves de repuesto y dinero en bolsa hermética",s:"Protección de cédulas, tarjetas, escrituras y llaves contra agua o pérdidas"},{v:"🔌 Batería externa (Power Bank) y directorio físico con teléfonos de socorro (119, 132, 144, 123)",s:"Líneas directas con Bomberos, Cruz Roja, Defensa Civil y Policía Nacional"},{v:"🐾 Kit de asistencia para mascotas (alimento seco, agua, correa y placa de identificación)",s:"Protección para perros y gatos que también forman parte del núcleo familiar"}]},{id:"servicios_hogar",type:"single",kicker:"PREVENCIÓN EN EL HOGAR · CORTE OPORTUNO DE SUMINISTROS BÁSICOS",fase:"APLICACIÓN PRÁCTICA",title:"En caso de un sismo fuerte en tu vivienda, ¿por qué es vital ubicar y cerrar los suministros básicos?",sub:"Selección única: Prevención de desastres secundarios (fuego, explosiones e inundaciones) en el hogar.",context:"Prevención en Vivienda Segura: La gran mayoría de víctimas tras un terremoto se deben a conflagraciones posteriores por fugas de gas o cortocircuitos eléctricos.",notebookPrompt:"Anota en tu cuaderno la ubicación exacta de los tacos de luz, llave de gas y llave de agua en tu casa.",detailedNotebookGuidance:`👉 Revisa: El corte de los 3 suministros vitales.
✍️ Escribe en tu cuaderno: "11. CORTE DE SERVICIOS EN CASA: ⚡ Bajar tacos de luz (previene chispas y cortocircuitos). 🔥 Cerrar llave de gas o pipeta (previene asfixia e incendios catastróficos). 💧 Cerrar registro de agua (evita inundaciones internas y fuga del líquido vital)."`,cols2:!0,options:[{v:"Para prevenir cortocircuitos, incendios, explosiones por escape de gas e inundaciones por tuberías rotas",s:"Acción preventiva clave para proteger la estructura del hogar y a los vecinos",iconType:"flame"},{v:"Para no gastar dinero en las facturas de servicios públicos del siguiente mes",s:"Aspecto económico secundario que no tiene relación con salvar vidas en la emergencia",iconType:"dollar-sign"},{v:"Para que los vecinos del barrio crean que la vivienda está completamente desocupada",s:"Idea errónea sin fundamentación en seguridad y rescate",iconType:"home"},{v:"Solo se debe cortar el gas si la casa está ubicada en zona rural abierta",s:"Falso: las tuberías urbanas sufren mayor fricción y riesgo de rotura sísmica",iconType:"alert-triangle"}]},{id:"plano_vivienda_concepto",type:"single",kicker:"REPRESENTACIÓN ESPACIAL · PLANO ARQUITECTÓNICO 2D DE VIVIENDA",fase:"ANÁLISIS PRÁCTICO",title:"En el dibujo técnico y la gestión del riesgo, ¿qué es un plano 2D de evacuación de tu vivienda?",sub:"Selección única: Comprende la perspectiva técnica necesaria para realizar tu compromiso en casa.",context:"El plano 2D es la herramienta visual del Plan Familiar. Permite que toda la familia y los rescatistas entiendan la distribución del hogar y las salidas en segundos.",notebookPrompt:"Define qué es un plano 2D en vista cenital y anota los 7 pasos para elaborarlo.",detailedNotebookGuidance:`👉 Revisa: La vista superior (sin techo) tipo pájaro o dron.
✍️ Escribe en tu cuaderno: "12. PLANO 2D DE MI VIVIENDA: Es un dibujo a escala visto desde arriba (sin techo) donde se representan los muros, habitaciones, cocina, puertas, zonas de peligro y las rutas directas de escape hacia la calle."`,cols2:!0,options:[{v:"Un dibujo bidimensional visto desde arriba (vista de pájaro o dron) sin techo que representa muros, espacios y rutas de salida",s:"Definición técnica de dibujo arquitectónico para la gestión del riesgo",iconType:"layout"},{v:"Una fotografía tomada desde el suelo mirando hacia las lámparas del techo",s:"Perspectiva contrapicada que no muestra distribución ni caminos de evacuación",iconType:"camera"},{v:"Un mapa turístico de carreteras departamentales para planear viajes",s:"Cartografía vial, no plano arquitectónico de seguridad del hogar",iconType:"map"},{v:"Un cartel artístico con dibujos abstractos para adornar la sala",s:"Expresión artística sin información de rutas ni código de seguridad",iconType:"palette"}]},{id:"codigo_colores_plano",type:"single",kicker:"NORMATIVA INSTITUCIONAL · CÓDIGO DE COLORES OFICIAL DEL PLANO",fase:"ANÁLISIS PRÁCTICO",title:"¿Cuál es el código de colores oficial para señalizar el plano de evacuación de tu casa?",sub:"Selección única: Norma estándar universal que emplearás en la tarea de tu cuaderno.",context:"El código de colores estandarizado salva vidas porque permite a niños, adultos mayores y socorristas reconocer los peligros y las zonas seguras de un solo vistazo.",notebookPrompt:"Dibuja y escribe en tu cuaderno el significado de los tres colores: Verde, Rojo y Azul.",detailedNotebookGuidance:`👉 Revisa: La convención cromática de seguridad civil.
✍️ Escribe en tu cuaderno: "13. CÓDIGO DE COLORES DEL PLANO: 🟢 Verde = Lugares de Protección (bajo mesas macizas) y Zonas de Seguridad. 🔴 Rojo = Zonas de Peligro (cocina, estufa, ventanales grandes y escaleras). 🔵 Azul = Rutas de Evacuación continuas y flechas hacia la puerta de salida."`,cols2:!0,options:[{v:"🟢 Verde: Zonas y Lugares Seguros | 🔴 Rojo: Zonas de Peligro | 🔵 Azul: Rutas de Evacuación y flechas de salida",s:"Código de colores oficial de las normas técnicas y manuales de protección civil",iconType:"palette"},{v:"🟡 Amarillo para todo el plano | ⚫ Negro para las puertas | ⚪ Blanco para los muebles",s:"Esquema monocromático sin diferenciación de riesgos ni seguridad",iconType:"x-circle"},{v:"🟣 Morado para la cocina | 🟠 Naranja para los cuartos | 🟤 Café para el baño",s:"Colores decorativos arbitrarios que confunden a los brigadistas",iconType:"x-circle"},{v:"Cualquier color al azar sin importar el significado técnico",s:"Incumple la normatividad de señalización preventiva",iconType:"alert-triangle"}]},{id:"zonas_peligro_hogar",type:"single",kicker:"DIAGNÓSTICO DE RIESGO · ZONAS DE PELIGRO EN LA VIVIENDA (COLOR ROJO)",fase:"ANÁLISIS PRÁCTICO",title:"En tu plano de vivienda, ¿cuáles espacios deben marcarse en ROJO como ZONAS DE PELIGRO?",sub:"Selección única: Reconoce las áreas con fuentes de ignición, tropiezos o vidrios frágiles.",context:"Una Zona de Peligro dentro de la vivienda es cualquier espacio donde un sismo puede causar quemaduras, golpes por caídas, cortes por vidrios o electrocución.",notebookPrompt:"Anota los 4 lugares con mayor riesgo dentro de tu vivienda y cómo protegerse de ellos.",detailedNotebookGuidance:`👉 Revisa: Los puntos críticos donde puede haber fuego, caídas o cortes.
✍️ Escribe en tu cuaderno: "14. ZONAS DE PELIGRO EN MI VIVIENDA (COLOR ROJO): 1. Cocina (gas y objetos calientes). 2. Escaleras (riesgo de caídas por movimiento). 3. Ventanales de vidrio grandes sin película protectora. 4. Pasillos con muebles o repisas pesadas no ancladas."`,cols2:!0,options:[{v:"Cocina (gas y fuentes de calor), escaleras (riesgo de caídas), ventanales grandes y cables expuestos",s:"Zonas críticas que requieren precaución extrema y corte inmediato de suministros",iconType:"flame"},{v:"El patio interior abierto y libre de cables aéreos",s:"Zona despejada que clasifica como segura, no como peligro",iconType:"sun"},{v:"La cama del dormitorio principal y las almohadas",s:"Mobiliario de descanso que no representa peligro estructural",iconType:"moon"},{v:"El clóset de ropa con puertas correderas de madera",s:"Mueble bajo que no contiene químicos inflamables",iconType:"archive"},{v:"La mesa de madera maciza del comedor familiar",s:"Lugar de protección para cubrirse, clasificado en verde",iconType:"shield"}]},{id:"lugares_proteccion_encuentro",type:"single",kicker:"PLAN FAMILIAR · LUGAR DE PROTECCIÓN vs PUNTO DE ENCUENTRO EXTERIOR",fase:"ANÁLISIS PRÁCTICO",title:'¿Qué diferencia existe entre un "Lugar de Protección" y una "Zona de Seguridad" en tu plan familiar?',sub:"Selección única: Distingue el refugio temporal dentro de casa del punto de reunión externo.",context:"Plan Familiar (PFGRD): Durante el sismo no debes salir corriendo; te resguardas en el Lugar de Protección. Solo después de que cese el temblor, evacúas hacia la Zona de Seguridad.",notebookPrompt:"Diferencia en tu cuaderno el Lugar de Protección interno de la Zona de Seguridad externa.",detailedNotebookGuidance:`👉 Revisa: Refugio interno (durante) vs Punto de reunión externo (después).
✍️ Escribe en tu cuaderno: "15. Refugio Interno vs Encuentro Externo: - Lugar de Protección: Espacio seguro DENTRO de casa para agacharse y cubrirse durante el sismo (ej: bajo la mesa del comedor o pasillo resistente). - Punto de Encuentro: Espacio amplio FUERA de casa (ej: Parque de La Pola o cancha múltiple) para reunirse tras evacuar."`,cols2:!0,options:[{v:"Lugar de Protección es un sitio seguro dentro de casa (pasillo/vigas); Zona de Seguridad es el punto de encuentro exterior (parque/cancha)",s:"Diferencia vital para no salir corriendo a la calle durante la sacudida",iconType:"home"},{v:"Lugar de protección es el tejado de la casa y zona de seguridad es el ascensor del edificio",s:"Espacios de altísimo peligro de colapso y encierro mecánico",iconType:"alert-triangle"},{v:"Ambos términos son exactamente lo mismo y se ubican debajo de la cama",s:"Confusión peligrosa: salir de la vivienda requiere evacuación posterior",iconType:"x-circle"},{v:"Zona de seguridad es el aula de informática y lugar de protección es la estación de policía",s:"Instalaciones comunitarias que no corresponden al plan interno de la vivienda",iconType:"briefcase"}]},{id:"atencion_prioritaria_discapacidad",type:"single",kicker:"SOLIDARIDAD Y DERECHOS HUMANOS · ATENCIÓN PRIORITARIA E INCLUSIÓN",fase:"ANÁLISIS PRÁCTICO",title:"En un Plan Familiar de Gestión del Riesgo inclusivo, ¿cómo se debe actuar con personas vulnerables?",sub:"Selección única: Responsabilidad solidaria con niños, adultos mayores, personas con discapacidad y animales.",context:"Guía Institucional: Nadie se queda atrás. La resiliencia auténtica se demuestra organizando roles claros para que los miembros más vulnerables reciban apoyo inmediato.",notebookPrompt:"Anota los roles familiares acordados para ayudar a abuelos, niños pequeños y mascotas.",detailedNotebookGuidance:`👉 Revisa: El principio de solidaridad y atención incluyente.
✍️ Escribe en tu cuaderno: "16. PLAN FAMILIAR INCLUSIVO: Asignamos responsables previos en mi hogar: mi acudiente apoya a los miembros de la tercera edad o con movilidad reducida, y yo me encargo de asegurar a nuestra mascota con collar y llevar la mochila de emergencia con sus alimentos."`,cols2:!0,options:[{v:"Asignar roles específicos y acompañamiento directo a niños, adultos mayores, personas con discapacidad y mascotas",s:"Enfoque inclusivo y de derechos humanos del PEGRD y el Plan Familiar",iconType:"heart"},{v:"Dejar que cada integrante de la familia corra y se salve como pueda por su cuenta",s:"Desorden egoísta que incrementa el pánico y las tragedias familiares",iconType:"alert-octagon"},{v:"Esperar a que termine la emergencia para buscar a los familiares a través de redes sociales",s:"Reacción tardía que no protege vidas en el momento crítico de la evacuación",iconType:"smartphone"},{v:"Excluir a las mascotas y animales domésticos del plan de evacuación de la casa",s:"Omisión indebida: los animales sufren pánico y requieren contención segura",iconType:"frown"}]}],kb=[{id:"fam_contactos",type:"family_form",kicker:"FORMATO OFICIAL 0_PFGRD · SECCIÓN 1: DATOS GENERALES Y TELÉFONOS",fase:"PLAN FAMILIAR (PFGRD)",title:"Apellidos de tu Familia y Teléfonos Principales de Contacto",sub:"Acuerda con tus familiares los dos números telefónicos indispensables y la dirección del hogar.",context:"En una emergencia o catástrofe, contar con dos números de contacto claros y la dirección exacta permite a los organismos de socorro y al colegio coordinar la asistencia inmediata.",notebookPrompt:"Escribe en tu cuaderno los apellidos familiares, dirección de vivienda y 2 teléfonos clave de contacto.",detailedNotebookGuidance:`👉 Revisa: Los dos teléfonos de contacto y dirección exacta con nomenclatura oficial.
✍️ Escribe en tu cuaderno: "SECCIÓN 1 DEL PLAN FAMILIAR: Familia [Tus Apellidos]. Dirección: [Dirección exacta y barrio en Ibagué]. Teléfono 1: [Número de acudiente]. Teléfono 2: [Segundo contacto de respaldo]."`,fields:[{id:"apellidos_familia",label:"1. Apellidos de tu Familia",placeholder:"Ej: Familia Gómez Rodríguez / Familia Valencia Motta",type:"text",minLength:4},{id:"tel_familiar_1",label:"2. Teléfono Principal de Contacto 1 (Acudiente 1)",placeholder:"Ej: 315 234 5678 (Celular mamá/papá)",type:"tel",minLength:7},{id:"tel_familiar_2",label:"3. Teléfono Principal de Contacto 2 (Acudiente 2 / Fijo)",placeholder:"Ej: 310 987 6543 / (608) 261 0000",type:"tel",minLength:7},{id:"direccion_vivienda",label:"4. Dirección de la Vivienda y Barrio (Ibagué)",placeholder:"Ej: Cra 3 # 7-45 Barrio La Pola / Belén / Centro",type:"text",minLength:5}]},{id:"fam_puntos_encuentro",type:"family_form",kicker:"FORMATO OFICIAL 0_PFGRD · SECCIÓN 2: PUNTOS DE ENCUENTRO FAMILIAR",fase:"PLAN FAMILIAR (PFGRD)",title:"Puntos de Encuentro Familiar y Salida de la Ciudad",sub:"Decidan dónde reunirse si no pueden ingresar a la casa o si colapsan las redes de telefonía.",context:"Si ocurre una emergencia y están separados o no pueden regresar a casa, los puntos de encuentro evitan la desesperación y garantizan la reunificación familiar.",notebookPrompt:"Anota los dos puntos de encuentro y la persona de contacto fuera de Ibagué.",detailedNotebookGuidance:`👉 Revisa: Los puntos de encuentro acordados con tu familia.

en trampas ni Fake News 🧩)",explicacionPedagogica:"Las 4 C (Pensamiento Crítico, Creatividad, Comunicación Asertiva y Colaboración) son pilares fundamentales para no difundir desinformación ni pánico.",queDebesComprender:"En una emergencia no se deben compartir audios ni cadenas falsas en WhatsApp; siempre se debe verificar en fuentes oficiales (SGC, Bomberos, Cruz Roja, UNGRD).",registroCuaderno:"Consigna en tu cuaderno las 4 C del Siglo XXI y el compromiso de no compartir noticias falsas sobre emergencias."},amenaza_concepto:{id:"amenaza_concepto",preguntaNum:4,tituloCorto:"Concepto Técnico de AMENAZA (Ley 1523 de 2012)",tipo:"evaluable",respuestaCorrecta:"Un factor latente o fenómeno físico externo que puede causar pérdidas humanas, lesiones o daños materiales",explicacionPedagogica:"Una amenaza es un fenómeno externo que no podemos evitar directamente (ejemplo: un sismo o erupción volcánica).",queDebesComprender:"La amenaza proviene de la naturaleza o del entorno físico; no depende de si estamos preparados o no.",registroCuaderno:"Anota la definición de AMENAZA según la Ley 1523 de 2012: factor latente o fenómeno potencialmente dañino de origen natural o antrópico."},vulnerabilidad_concepto:{id:"vulnerabilidad_concepto",preguntaNum:5,tituloCorto:"Concepto Técnico de VULNERABILIDAD",tipo:"evaluable",respuestaCorrecta:"La fragilidad física o falta de preparación de una estructura o personas que las hace susceptibles de sufrir daño",explicacionPedagogica:"La vulnerabilidad es la fragilidad interna: casas mal construidas, estantes no anclados, falta de rutas o desorganización familiar.",queDebesComprender:"No podemos apagar un temblor, pero sí podemos reducir a cero nuestra vulnerabilidad asegurando muebles y acordando puntos de encuentro.",registroCuaderno:"Define VULNERABILIDAD: debilidad o falta de preparación interna ante una amenaza que puede reducirse con planeación y prevención."},riesgo_formula:{id:"riesgo_formula",preguntaNum:6,tituloCorto:"Fórmula Matemática y Conceptual del RIESGO",tipo:"evaluable",respuestaCorrecta:"Riesgo = (Amenaza × Vulnerabilidad) ÷ Organización: A mayor preparación escolar y familiar, menor es el riesgo",explicacionPedagogica:"Fórmula rectora del PEGRD: el riesgo se reduce aumentando la capacidad comunitaria y organizativa y disminuyendo la vulnerabilidad.",queDebesComprender:"Aunque la amenaza sísmica en Ibagué es fija, si aumentamos la organización familiar (mochila 72H y plano 2D), el riesgo disminuye al mínimo.",registroCuaderno:"Escribe la fórmula científica: Riesgo = (Amenaza × Vulnerabilidad) ÷ Organización. Explica por qué a mayor organización, menor riesgo."},peligro_exposicion:{id:"peligro_exposicion",preguntaNum:7,tituloCorto:"Diferenciación entre PELIGRO y EXPOSICIÓN",tipo:"evaluable",respuestaCorrecta:"El peligro es la fuente o condición potencial de daño; la exposición es la presencia de personas en esa zona",explicacionPedagogica:"El peligro es la fuente potencial de daño (ej: ventanal grande sin película o pipeta de gas); la exposición es tener camas o personas ubicadas en su radio de impacto.",queDebesComprender:"Diferenciar peligro de exposición es vital para diseñar el plano 2D del hogar y ubicar muebles y camas en lugares seguros.",registroCuaderno:"Diferencia Peligro vs Exposición: El peligro es la fuente física de riesgo; la exposición es la presencia humana en la zona susceptible."},alerta_sismo:{id:"alerta_sismo",preguntaNum:8,tituloCorto:"Conducta Inmediata Durante el Sismo (Autoprotección)",tipo:"evaluable",respuestaCorrecta:"Autoprotección inmediata: Agacharme, cubrirme bajo mesa o estructura firme y sujetarme protegiendo cabeza y nuca",explicacionPedagogica:'La técnica universal "Agacharse, Cubrirse y Sujetarse" previene traumatismos por desprendimiento de vidrios, mampostería o lámparas.',queDebesComprender:"Durante el movimiento jamás se debe correr hacia la calle ni bajar escaleras; la inmensa mayoría de lesiones ocurren por caídas al huir mientras tiembla.",registroCuaderno:"Anota los 3 pasos de supervivencia durante el sismo: 1. Agacharse, 2. Cubrirse bajo mesa firme, 3. Sujetarse. Jamás correr."},alarma_evacuacion:{id:"alarma_evacuacion",preguntaNum:9,tituloCorto:"Procedimiento de Evacuación Post-Sismo",tipo:"evaluable",respuestaCorrecta:"Evacuación ordenada: Paso firme sin correr, cubriendo la cabeza, hacia el punto de encuentro exterior despejado",explicacionPedagogica:"Se evacúa INMEDIATAMENTE DESPUÉS de que cese la sacudida principal, bajando por la derecha con manos en la nuca hacia zona abierta.",queDebesComprender:"Evacuar mientras el piso se mueve provoca tropiezos y fracturas graves en escaleras. Espera a que termine la sacudida y sal con paso firme.",registroCuaderno:"Regla de evacuación: Esperar a que cese la sacudida -> cortar suministros -> evacuar caminando con paso firme hacia punto de encuentro exterior."},mochila_familiar:{id:"mochila_familiar",preguntaNum:10,tituloCorto:"Mochila de Emergencia / Kit de 72 Horas (UNGRD)",tipo:"evaluable",respuestaCorrecta:"Mínimo 2 elementos vitales: Agua potable, Linterna con pilas, Radio a pilas, Botiquín o Alimentos enlatados",explicacionPedagogica:"Los organismos de socorro pueden tardar hasta 72 horas en restablecer servicios de agua y energía tras un gran terremoto en Ibagué.",queDebesComprender:"La mochila debe colocarse junto a la puerta principal de salida para tomarla de inmediato sin perder tiempo.",registroCuaderno:"Lista los elementos vitales de la Mochila 72H: Agua (2L/persona/día), Linterna con pilas, Radio AM/FM, Botiquín y Alimentos enlatados."},servicios_hogar:{id:"servicios_hogar",preguntaNum:11,tituloCorto:"Corte Oportuno de Suministros Básicos (Luz, Gas, Agua)",tipo:"evaluable",respuestaCorrecta:"Para prevenir cortocircuitos, incendios, explosiones por escape de gas e inundaciones por tuberías rotas",explicacionPedagogica:"El 70% de las víctimas colaterales en terremotos mueren por incendios provocados por escapes de gas y cortocircuitos eléctricos posteriores.",queDebesComprender:"Bajar los tacos de luz, cerrar la llave general de gas y el registro de agua previene tragedias secundarias devastadoras en el hogar.",registroCuaderno:"Escribe los 3 suministros que deben cortarse tras el sismo: 1. Luz (tacos), 2. Gas (llave de paso), 3. Agua (registro general)."},plano_vivienda_concepto:{id:"plano_vivienda_concepto",preguntaNum:12,tituloCorto:"Definición Técnica de Plano Arquitectónico 2D",tipo:"evaluable",respuestaCorrecta:"Un dibujo bidimensional visto desde arriba (vista de pájaro o dron) sin techo que representa muros, espacios y rutas de salida",explicacionPedagogica:"Un plano 2D cenital representa la distribución real de la vivienda vista desde arriba, sin techos, mostrando accesos y salidas.",queDebesComprender:"El plano 2D orienta a toda la familia y a rescatistas sobre salidas despejadas, peligros estructurales y ubicación de suministros.",registroCuaderno:"Define Plano 2D: dibujo técnico visto desde arriba (vista cenital sin techo) que muestra muros, puertas, zonas seguras y rutas de escape."},codigo_colores_plano:{id:"codigo_colores_plano",preguntaNum:13,tituloCorto:"Código de Colores Oficial del Plano de Evacuación",tipo:"evaluable",respuestaCorrecta:"🟢 Verde: Zonas y Lugares Seguros | 🔴 Rojo: Zonas de Peligro | 🔵 Azul: Rutas de Evacuación y flechas de salida",explicacionPedagogica:"Código cromático universal de seguridad civil: Verde (protección/seguridad), Rojo (peligro/combustión), Azul (rutas continuas de escape).",queDebesComprender:"El plano que dibujes en tu cuaderno DEBE usar estrictamente estos 3 colores para que sea comprensible y técnico.",registroCuaderno:"Dibuja el código de 3 colores: 🟢 Verde = Lugares seguros; 🔴 Rojo = Peligros (cocina/vidrios); 🔵 Azul = Rutas de escape continuas."},zonas_peligro_hogar:{id:"zonas_peligro_hogar",preguntaNum:14,tituloCorto:"Zonas de Peligro en la Vivienda (Color Rojo)",tipo:"evaluable",respuestaCorrecta:"Cocina (gas y fuentes de calor), escaleras (riesgo de caídas), ventanales grandes y cables expuestos",explicacionPedagogica:"La cocina contiene fuentes de fuego y calor; las escaleras provocan caídas por oscilación; los ventanales se rompen proyectando esquirlas.",queDebesComprender:"En caso de sismo jamás se debe intentar refugiar en la cocina ni permanecer en escaleras.",registroCuaderno:"Identifica las 4 zonas de peligro en tu vivienda: cocina, escaleras, ventanales grandes y repisas pesadas sin anclaje."},lugares_proteccion_encuentro:{id:"lugares_proteccion_encuentro",preguntaNum:15,tituloCorto:"Lugar de Protección vs Punto de Encuentro Exterior",tipo:"evaluable",respuestaCorrecta:"Lugar de Protección es un sitio seguro dentro de casa (pasillo/vigas); Zona de Seguridad es el punto de encuentro exterior (parque/cancha)",explicacionPedagogica:"Lugar de Protección = refugio DENTRO de casa durante el sismo. Punto de Encuentro = espacio abierto FUERA de casa para reunirse tras evacuar.",queDebesComprender:"No intentes salir a la calle durante la sacudida; resguárdate en el lugar de protección interno y evacúa solo cuando cese el movimiento.",registroCuaderno:"Diferencia en el cuaderno: Refugio interno (bajo mesa o junto a columna) vs Punto de encuentro exterior (parque o cancha abierta)."},atencion_prioritaria_discapacidad:{id:"atencion_prioritaria_discapacidad",preguntaNum:16,tituloCorto:"Atención Prioritaria e Inclusión Solidaria",tipo:"evaluable",respuestaCorrecta:"Asignar roles específicos y acompañamiento directo a niños, adultos mayores, personas con discapacidad y mascotas",explicacionPedagogica:"Enfoque de derechos humanos y solidaridad del Plan Familiar: nadie se queda atrás ni se deja abandonado.",queDebesComprender:"Cada integrante del hogar debe tener asignado previamente a quién apoya (adultos mayores, niños, mascotas o traslado de la mochila 72H).",registroCuaderno:"Registra los roles de apoyo inclusivo: asignación previa de quién asiste a abuelos, niños pequeños y mascotas del hogar."},t_juego:{id:"t_jueg
